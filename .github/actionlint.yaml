# Declare the self-hosted runner labels used in this repo so actionlint
# does not flag them as unknown.
#
# The list covers templates/ as well as .github/workflows/. This
# repository runs only on `static`, but the workflow templates it ships
# to the fleet name the labels their target projects run on, and those
# templates are linted here -- they are the fleet's source of truth for
# files nothing else checks before they are copied into ten repositories.
self-hosted-runner:
  labels:
    - static
    - claude-code
    - vm
    - debian-12
    - s
    - m
