# Lint this repository's own workflows, shell scripts, and Python.
# The consistency audits require every audited project to run
# actionlint, shellcheck, and flake8 via a pre-commit; this repo holds
# itself to that same standard even though it is exempt from the audits.
#
# Note: .pre-commit-hooks.yaml (the review-stamp/review-prune hooks this
# repo *provides* to other repositories) is a separate concern from this
# file (the hooks this repo runs on *itself*).
#
# The renovate audit now requires audited projects to enable renovate's
# opt-in pre-commit manager so these revisions stop drifting. This repo
# is excluded from the audits and runs no renovate, so the same rule
# cannot apply to it: bump the three revisions below by hand when you
# notice them aging, as happened here when the audit rule was written.
repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/
        types_or: [sh, bash, shell]
        args: ['-x']

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^scripts/.*\.py$

  # The llm-context-lint-ci audit requires every audited project with
  # agent context to run skillsaw here and in CI. This repo is exempt
  # from the audits but carries .claude/skills/ and AGENTS.md, so it
  # holds itself to the rule it writes. The rev is bumped by hand for
  # the same reason as the three above.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.18.0
    hooks:
      - id: skillsaw

  # The automation's own unit tests. They run here because there is
  # nowhere else for them to run: the only workflow in this repository
  # is the consistency audit, so until this hook existed a broken audit
  # script was first noticed by the audit failing at 06:00 UTC. That is
  # how review-marks-pre-commit reached production without a
  # COLUMN_NAMES heading and cost the fleet a day of compliance tables.
  #
  # language: system rather than a managed environment because all
  # three suites are stdlib-only, which is also why the audit scripts
  # can run on a bare runner. pass_filenames is off: they take no
  # arguments and always test the whole surface.
  - repo: local
    hooks:
      - id: audit-check-tests
        name: audit check tests
        entry: python3 scripts/test_audit_check.py
        language: system
        pass_filenames: false
        # templates/ as well as scripts/, because the shared-block
        # tests read the canonical blocks from templates/shared-blocks.
        files: ^(scripts/.*\.py|templates/shared-blocks/.*\.md)$

      - id: audit-update-docs-tests
        name: audit doc rendering tests
        entry: python3 scripts/test_audit_update_docs.py
        language: system
        pass_filenames: false
        files: ^scripts/.*\.py$

      - id: review-tracking-tests
        name: review tracking tests
        entry: python3 scripts/test_review_tracking.py
        language: system
        pass_filenames: false
        files: ^scripts/.*\.py$
