# Declare the self-hosted runner labels used in this repo so actionlint
# does not flag them as unknown.
#
# The list covers templates/ as well as .github/workflows/. This
# repository runs on `static` apart from the gitleaks job, which needs
# `debian-13` because that is the first Debian to package gitleaks. The
# rest of the labels belong to the workflow templates it ships to the
# fleet, which name the runners their target projects use and are linted
# here -- this is the fleet's source of truth for files nothing else
# checks before they are copied into ten repositories.
#
# `debian-13-docker` is one of those: the mermaid-lint template needs a
# docker daemon, and static runners do not have one.
#
# The bookworm labels are deliberately absent. Debian 12 went end of
# life on 2026-06-10, and the eol-distro consistency audit fails any
# workflow or template still naming it -- so a `debian-12` label
# reappearing here should fail actionlint rather than be waved
# through.
self-hosted-runner:
  labels:
    - static
    - claude-code
    - vm
    - debian-13
    - debian-13-docker
    - s
    - m
