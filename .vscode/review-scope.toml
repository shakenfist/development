# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators. An empty include list would mean all tracked
# files.
#
# There is no application code here, so the reviewable artifacts are
# the audit tooling (scripts/), the workflows that run it, the
# templates the fleet copies from, and the prose that defines what the
# standards are. The templates matter most of anything here: a
# template is copied into ten repositories, so a mistake in one is a
# mistake ten times over, and nothing in CI reads them as the files
# they will become.
include = ['*.py', '*.sh', '*.md', '*.yml', '*.yaml']

# docs/plans/ and the root PLAN-*.md files are point-in-time records
# of intended work, not living artifacts, and would swamp the queue.
#
# audits/*.md are excluded for a different and more specific reason.
# Each one carries a machine-regenerated compliance table between
# consistency-audit markers, and the table's "Last regenerated" line
# is rewritten on every audit run -- 27 of these files changed in a
# single bot commit on 2026-08-19, and that happens most days. That
# timestamp is deliberate: it is how a reader tells a current verdict
# from a stale one when the audit has silently stopped running. But a
# review mark attests to whole-file content, so a file whose last
# line moves daily can never hold one. Including them would put 35
# permanently-stale files in the queue and keep a review-coverage
# issue open that no amount of reviewing could close, which would
# make the alert useless for the files it can actually speak for.
# The prose in these files is reviewed as part of reviewing the
# change that writes it.
exclude = [
    'docs/plans/*',
    'PLAN-*.md',
    'audits/*',
]
