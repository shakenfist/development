name: Consistency audit

on:
  schedule:
    # Weekly, at 18:00 UTC on Sunday: 05:00 on Monday in Canberra
    # under daylight saving, 04:00 outside it. A daily run filed and
    # closed issues faster than the fleet could absorb them, and the
    # fixes were most of the PRs in some repositories. Once a week
    # turns that into a small backlog to start the working week on.
    # workflow_dispatch below re-runs it on demand, which is how to
    # close issues for fixes that did not close them from the PR body.
    # export-repo-config still runs daily at 00:30, so its output is
    # never more than a day old when this reads it.
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions: {}

# One run at a time, across the schedule and every dispatch. Two runs
# that overlapped would each file the issues the other was about to,
# and race each other's compliance page pushes. cancel-in-progress is
# off, so a run that has started is never killed part way through
# managing issues: a later one waits for it instead. GitHub keeps one
# waiting run per group, so if several are queued the newest replaces
# the others before they start.
concurrency:
  group: consistency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit ${{ matrix.repo }}
    runs-on: [self-hosted, static]
    # Bounded so one repository cannot hold the matrix open to the
    # 360-minute default. The checks read markdown from the audited
    # repository, so their cost is that repository's to choose; a leg
    # that normally takes a couple of minutes and instead runs for six
    # hours is a poisoned input, not a slow clone.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo:
          - actions
          - agent-python
          - andris
          - client-python
          - client-python-k3s
          - client-python-ova
          - clingwrap
          - cloudgood
          # The repository this workflow lives in. It holds the audit
          # specifications and the tooling, so an exemption here is an
          # exemption written by the people the standard is for.
          - development
          - divergulent
          - hunkydory
          # Scoped to eol-distro alone by REPO_OVERRIDES; see the
          # partial-scope paragraph in docs/audits/README.md for why.
          - images
          - instar
          - kerbside
          - kerbside-client
          - kerbside-patches
          - library-utilities
          - occystrap
          # Scoped to a subset of checks by REPO_OVERRIDES; see the
          # partial-scope paragraph in docs/audits/README.md for which
          # checks currently apply and why.
          - private-ci
          - ryll
          - shakenfist
          - sfui
          - uncalibrated-sextant
          - visual-digest-rust
    steps:
      # No credential left in .git/config. Nothing in this job pushes,
      # and its later steps run code over another repository's files.
      - name: Checkout development repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The legs hold AUDIT_READ_TOKEN, which can read every repository
      # in the organisation and write to none of them. AUDIT_TOKEN, which
      # files issues and pushes, appears only in manage-issues and
      # update-docs: the checks here read files the audited repositories
      # control, and run programs over them.
      #
      # An unset secret expands to an empty string, and gh given an
      # empty GH_TOKEN falls back to whatever login the runner's user
      # holds, so test for it rather than let that decide what is
      # measured. Then check the token can see the two repository fields
      # GitHub hides from callers without admin access: without them
      # delete-branch-on-merge would fail every repository, and
      # github-security would stop checking secret scanning without
      # saying so.
      - name: Check the read token
        env:
          GH_TOKEN: ${{ secrets.AUDIT_READ_TOKEN }}
        run: |
          test -n "${GH_TOKEN}" || { echo '::error::AUDIT_READ_TOKEN is not set'; exit 1; }
          visible=$(gh api "repos/${GITHUB_REPOSITORY}" \
              --jq '.delete_branch_on_merge != null and .security_and_analysis != null')
          [ "${visible}" = true ] || { echo '::error::AUDIT_READ_TOKEN cannot see repository settings'; exit 1; }

      # Every path this job writes is under runner.temp, which belongs
      # to this runner and is emptied between jobs. The static runners
      # share hosts, and a fixed /tmp path is shared by every leg and
      # every other job on one: a leg's clean-up could remove another
      # leg's clone mid-audit, and a venv an earlier job left behind
      # would run its code in an interpreter holding the token.
      - name: Clone target repo
        run: |
          gh repo clone "shakenfist/${{ matrix.repo }}" "${RUNNER_TEMP}/audit-target" -- --depth 1
        env:
          GH_TOKEN: ${{ secrets.AUDIT_READ_TOKEN }}

      # Pinned deliberately. The llm-context-lint check reports what
      # skillsaw calls an error, and skillsaw's rule set moves between
      # releases, so an unpinned upgrade would make the compliance
      # table change for reasons nobody chose. Bump this on purpose.
      #
      # Into a venv, not the system python. The runners enforce PEP 668,
      # so a bare `pip install` is refused with
      # "error: externally-managed-environment" -- which is how every
      # leg of this matrix started failing on 2026-08-20, taking the
      # compliance page and issue filing with it. --clear because a
      # .pth file left in a venv survives a second `python3 -m venv`
      # over the top of it.
      #
      # And a venv of skillsaw's own, which goes nowhere near PATH: the
      # audit step names the binary in AUDIT_SKILLSAW instead. On PATH,
      # this venv's python3 would be the one audit-check.py ran under,
      # importing skillsaw's unpinned dependencies into the interpreter
      # that holds the token. No step that touches this venv has a
      # token in its environment, and skillsaw_errors() strips it from
      # skillsaw's.
      - name: Install skillsaw
        run: |
          python3 -m venv --clear "${RUNNER_TEMP}/skillsaw-venv"
          "${RUNNER_TEMP}/skillsaw-venv/bin/pip" install --disable-pip-version-check \
              skillsaw==0.18.0

      # A skillsaw that cannot run does not fail the audit:
      # skillsaw_errors() catches FileNotFoundError and returns None,
      # and check_llm_context_lint turns that into not_applicable -- so a
      # broken install quietly stops measuring one check across every
      # repository in the matrix, and the table says so in a way that
      # looks deliberate. Assert it here instead, where the failure is
      # unambiguous, and assert the pinned version rather than just that
      # something answers: the whole point of the pin above is that the
      # rule set does not move underneath the compliance page.
      - name: Check skillsaw runs, at the pinned version
        run: |
          set -e
          echo "skillsaw reports: $("${RUNNER_TEMP}/skillsaw-venv/bin/skillsaw" --version)"
          "${RUNNER_TEMP}/skillsaw-venv/bin/skillsaw" --version | grep -qx 'skillsaw 0.18.0'

      - name: Run audit checks
        id: audit
        run: |
          python3 scripts/audit-check.py \
            --repo-path "${RUNNER_TEMP}/audit-target" \
            --repo-name "${{ matrix.repo }}" \
            --github-org shakenfist \
            > "${RUNNER_TEMP}/audit-result-${{ matrix.repo }}.json"
          cat "${RUNNER_TEMP}/audit-result-${{ matrix.repo }}.json"
        env:
          GH_TOKEN: ${{ secrets.AUDIT_READ_TOKEN }}
          AUDIT_SKILLSAW: ${{ runner.temp }}/skillsaw-venv/bin/skillsaw

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: audit-${{ matrix.repo }}
          path: ${{ runner.temp }}/audit-result-${{ matrix.repo }}.json
          retention-days: 30

      # A check that raised is reported as `error` rather than taking
      # the other criteria down with it (registry.run_check). Failing
      # the leg here, after the upload, keeps that bug loud --
      # report-failure fires and update-docs does not publish a page
      # with a hole in it -- while manage-issues still gets this
      # repository's artifact and manages every other criterion.
      - name: Fail if any check raised
        run: python3 scripts/audit-raised.py "${RUNNER_TEMP}/audit-result-${{ matrix.repo }}.json"

      # This leg's paths and nothing else's.
      - name: Clean up
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/audit-target" "${RUNNER_TEMP}/skillsaw-venv" \
              "${RUNNER_TEMP}/audit-result-${{ matrix.repo }}.json"

  manage-issues:
    name: Manage consistency issues
    needs: audit
    # Runs even when a leg of the matrix failed. fail-fast: false
    # already preserves the other legs' artifacts, and without this
    # they were downloaded and then thrown away: one repository whose
    # audit timed out stopped issue filing for all the others. Safe
    # because audit-manage-issues.py iterates the result files it
    # finds, so a repository with no artifact is not processed at all
    # -- its open issues are left alone rather than closed as passing.
    #
    # !cancelled() rather than always(): a run somebody stopped
    # should not go on to file and close issues across the fleet from
    # whichever artifacts happened to land before it was killed. A
    # newer run cannot supersede this one part way through: the
    # concurrency group above makes it wait.
    #
    # And only from main. A dispatch runs the workflow and scripts of
    # whichever branch it names, so without this a branch would file
    # and close real issues fleet-wide from its own copy of the checks.
    # The audit matrix still runs on a branch, which is how to measure
    # a change to the checks against the fleet before merging it, and
    # that is safe because the matrix holds only the read-only token.
    # This stops a dispatch of the wrong ref, not someone determined:
    # a branch can edit the condition out of its own copy.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, static]
    permissions:
      contents: read
    steps:
      # This job does not push either; update-docs below does, so its
      # checkout keeps the credential.
      - name: Checkout development repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all audit results
        uses: actions/download-artifact@v8
        with:
          path: audit-results
          pattern: audit-*
          merge-multiple: true

      - name: List results
        run: ls -la audit-results/

      - name: Manage issues
        run: |
          python3 scripts/audit-manage-issues.py \
            --results-dir audit-results/
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}

  # Regenerate docs/audits/compliance.md from the JSON results and
  # commit it back, so the docs cannot drift from what the audit
  # actually measured. Runs after manage-issues so the issue links in
  # the tables include issues created by this run. The tables are on
  # one generated page rather than in the criterion specs so that the
  # specs, which are hand-written, can hold a human review mark.
  update-docs:
    name: Update the audit compliance page
    # Deliberately NOT given manage-issues' !cancelled() treatment,
    # and the asymmetry is the point rather than an oversight. That
    # job only touches the repositories it has results for, so a
    # partial run is partial work. This one regenerates the whole
    # page: a repository whose leg failed has no artifact, renders as
    # `unknown` (AGENTS.md), and would be committed to main that way
    # -- replacing good verdicts with unknowns is worse than the
    # stale page report-failure already warns about.
    #
    # Only from main, as for manage-issues: a branch's page would
    # otherwise be pushed to main.
    needs: [audit, manage-issues]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, static]
    permissions:
      contents: write
    steps:
      - name: Checkout development repo
        uses: actions/checkout@v7

      - name: Download all audit results
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/consistency-audit-results
          pattern: audit-*
          merge-multiple: true

      - name: Regenerate the audit compliance page
        run: |
          python3 scripts/audit-update-docs.py \
            --results-dir "${RUNNER_TEMP}/consistency-audit-results"
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}

      - name: Commit and push the updated page
        run: scripts/commit-audit-docs.sh

      - name: Clean up
        if: always()
        run: rm -rf "${RUNNER_TEMP}/consistency-audit-results"

  # A scheduled workflow that fails emails whoever last pushed, which
  # is nobody's inbox in particular and is easy to miss for a workflow
  # that runs before anyone is up. The August 2026 PEP 668 breakage went
  # a full day that way, with the compliance page and issue filing stopped
  # the whole time and the tables still showing the previous run's
  # verdicts -- so the audit looked like it was working. This puts a
  # failure somewhere it will be seen, and updates one issue rather than
  # filing a fresh one on every run an outage continues.
  #
  # Only from main as well. A branch run that fails is being watched by
  # whoever dispatched it, and is not the scheduled audit the issue
  # says is failing.
  report-failure:
    name: Report audit failure
    needs: [audit, manage-issues, update-docs]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # gh issue create fails outright if the label does not exist, so
      # the report would be lost at exactly the moment it is wanted.
      # --force makes this idempotent.
      - name: Ensure the audit-failure label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create audit-failure \
              --repo "${GITHUB_REPOSITORY}" \
              --description "The scheduled consistency audit failed" \
              --color d73a4a --force

      - name: File or update the audit failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" \
              --label audit-failure --state open --limit 1 --json number \
              --jq '.[0].number // empty')

          # printf rather than a multi-line quoted string: the latter
          # carries this file's indentation into every continuation
          # line, and four leading spaces make GitHub-flavoured Markdown
          # render the whole body as a code block.
          body=$(printf '%s\n' \
              "The scheduled consistency audit failed." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              "While this is failing no compliance page is being" \
              "regenerated and no consistency issues are being filed or" \
              "closed, across every audited repository. The tables still" \
              "show the previous run's verdicts, so the audit looks" \
              "healthy from the outside -- check the run before trusting" \
              "anything in docs/audits/." \
              "" \
              "The audit runs weekly and nothing retries it, so a failure" \
              "lasts until the next Sunday unless someone acts. Once the" \
              "cause is fixed, start a run by hand with" \
              "\`gh workflow run consistency-audit.yml --repo ${GITHUB_REPOSITORY}\`" \
              "and close this issue once that run passes.")

          if [ -n "${existing}" ]; then
              echo "Commenting on existing audit failure issue #${existing}."
              gh issue comment "${existing}" \
                  --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
              echo "Filing a new audit failure issue."
              gh issue create --repo "${GITHUB_REPOSITORY}" \
                  --title "Scheduled consistency audit is failing" \
                  --label audit-failure \
                  --body "${body}"
          fi
