# Triggers a re-review of a PR when an authorized user comments
# "@shakenfist-bot please re-review"
#
# Template source: shakenfist/development/templates/ci-review-automation/
#
# The trigger and the review are separate jobs on purpose. A claude-code
# runner is scarce, and doing the permission check, the reaction and the
# refusal reply on one would hold a claude-code runner for every comment
# containing the phrase -- including comments from people with no write
# access at all. pr-address-comments.yml splits for the same reason.
#
# The trigger handling is pr-bot-trigger rather than inline shell. An
# earlier version of this file open-coded it, and the copy drifted: it
# reacted with +1 rather than rocket, worded its refusal differently,
# never checked the trigger phrase itself so it could not tell "phrase
# not matched" from "not authorized", and -- once pr-bot-trigger grew a
# fork guard -- did not refuse fork pull requests at all. Using the
# shared action is what keeps this file getting fixes made elsewhere.
name: PR Re-review

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]

jobs:
  trigger-re-review:
    name: "Trigger re-review"
    # Only run on PR comments (not issue comments), and never on a
    # comment the bot itself posted: pr-address-comments.yml quotes
    # model-generated summaries back into the pull request, and a
    # summary that mentions a trigger phrase would re-fire the lane.
    # contains() does not care that the phrase is inside a quote.
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@shakenfist-bot please re-review')
    runs-on: [self-hosted, static]
    # Just a few gh API calls, so anything beyond this is a hang.
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.trigger.outputs.authorized }}
      pr_number: ${{ github.event.issue.number }}

    steps:
      # pr-bot-trigger refuses fork pull requests as well as
      # unauthorised commenters, and folds both into `authorized`.
      - name: Handle trigger
        id: trigger
        uses: shakenfist/actions/pr-bot-trigger@main
        with:
          trigger-phrase: 'please re-review'
          reaction: 'rocket'

  re-review:
    name: "Re-review PR"
    needs: trigger-re-review
    if: needs.trigger-re-review.outputs.authorized == 'true'
    runs-on: [self-hosted, claude-code]
    # A review normally finishes in three to six minutes. Without this
    # the job inherits the six hour GitHub default, so a wedged Claude
    # run would hold a scarce claude-code runner for the rest of the day.
    timeout-minutes: 60
    # Two re-review requests in quick succession would otherwise run
    # concurrently on the scarce runner and post two reviews on the same
    # pull request. pr-auto-review.yml carries the same guard.
    concurrency:
      group: pr-re-review-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      # The pull request's merge ref, not the default branch. Without a
      # ref: this checks out main, and review-pr-with-claude.sh opens
      # every prompt by reading AGENTS.md, ARCHITECTURE.md and README.md
      # from the working directory -- so a re-review would judge the
      # change against the conventions as they were *before* it. The
      # diff itself comes from the API and is unaffected, which is what
      # makes the symptom subtle: a real review, calibrated wrongly.
      # pr-auto-review.yml checks out the merge ref for this reason and
      # says so in its header.
      #
      # This puts the pull request's code on the runner, which is
      # exactly why pr-bot-trigger refusing fork pull requests above is
      # load bearing rather than tidiness.
      - name: Checkout the pull request
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ needs.trigger-re-review.outputs.pr_number }}/merge
          fetch-depth: 0

      - name: Run automated reviewer
        uses: shakenfist/actions/review-pr-with-claude@main
        with:
          pr-number: ${{ needs.trigger-re-review.outputs.pr_number }}
          force: 'true'
