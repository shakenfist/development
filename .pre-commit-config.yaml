# Lint this repository's own workflows, shell scripts, and Python.
# The consistency audits require every audited project to run
# actionlint, shellcheck, and flake8 via a pre-commit, and this repo is
# one of the audited projects: running them here is what catches a
# breach at commit time instead of in the next morning's audit.
#
# The renovate audit also requires audited projects to enable
# renovate's opt-in pre-commit manager so these revisions stop
# drifting. This repo now runs renovate, and renovate.json enables that
# manager, so the revisions below are watched: expect them to arrive as
# pull requests rather than bumping them by hand, which would only
# conflict with what renovate is already proposing.
repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

      # The workflow templates too. The stock hook only looks at
      # .github/workflows/, so until now nothing checked the files this
      # repository ships to the rest of the fleet -- a broken template
      # would have been found by whoever copied it into their project.
      # They are ordinary workflow files, so actionlint reads them
      # happily when given the paths.
      #
      # The workflow-call resolution check is ignored, and only for
      # these files. A template's `uses: ./.github/workflows/x.yml` is
      # relative to the repository it gets copied *into*, so it cannot
      # resolve here, where the file sits under templates/. That is the
      # one thing about a template actionlint cannot judge from where it
      # is stored; everything else it checks is checked.
      #
      # Five templates carry {{PLACEHOLDER}} substitutions that are not
      # valid YAML until an adopting project fills them in -- a bare
      # {{PROJECT_NAME}} parses as a mapping, not a string -- so they
      # cannot be linted where they are stored. They are excluded by
      # name rather than by a pattern, so adding a sixth is a decision
      # somebody makes rather than one that happens quietly. The six
      # copy-directly templates, which are the ones the fleet actually
      # runs unmodified, are all checked.
      - id: actionlint
        alias: actionlint-templates
        name: Lint the workflow templates
        files: ^templates/.*\.ya?ml$
        exclude: |
          (?x)^templates/(
            issue-fix/issue-fix\.yml|
            pin-indirect-dependencies/pin-indirect-dependencies\.yml|
            release-automation/release\.yml|
            renovate/renovate\.yml|
            test-drift-fix/test-drift-fix\.yml
          )$
        args:
          - '-config-file'
          - '.github/actionlint.yaml'
          - '-ignore'
          - 'could not read reusable workflow file'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      # scripts/ and tools/ both hold code this repository runs.
      # templates/ is excluded by the pattern on purpose: those files
      # are shipped to other repositories, and several reference
      # variables defined by the workflow that calls them.
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^(scripts|tools)/.*\.py$

  # The llm-context-lint-ci audit requires every audited project with
  # agent context to run skillsaw here and in CI. This repo is audited
  # by its own checks and carries .claude/skills/ and AGENTS.md, so the
  # rule it writes applies to it directly.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.18.0
    hooks:
      - id: skillsaw

  # The automation's own unit tests. They used to run only here,
  # because there was nowhere else for them to run: the only workflow in
  # this repository was the consistency audit, so until this hook
  # existed a broken audit script was first noticed by the audit failing
  # at 06:00 UTC. That is how review-marks-pre-commit reached production
  # without a COLUMN_NAMES heading and cost the fleet a day of
  # compliance tables.
  #
  # ci.yml now runs `pre-commit run --all-files` on every pull request,
  # so these are enforced rather than merely available. Keep them here
  # too: the local run is what makes the CI run boring.
  #
  # language: system rather than a managed environment because all
  # three suites are stdlib-only, which is also why the audit scripts
  # can run on a bare runner. pass_filenames is off: they take no
  # arguments and always test the whole surface.
  - repo: local
    hooks:
      - id: audit-check-tests
        name: audit check tests
        entry: python3 scripts/test_audit_check.py
        language: system
        pass_filenames: false
        # Markdown and workflows as well as scripts/, because this
        # suite reads all three: the shared-block tests read the
        # canonical blocks from templates/shared-blocks, and
        # AuditScopeIsStatedOnceTest reads the audit matrix out of
        # .github/workflows/consistency-audit.yml and the scope lists
        # out of docs/audits/README.md by splitting it on phrases in
        # its prose. The commit that breaks one of those parses is a
        # documentation commit, so a scripts-only filter never ran the
        # suite that would catch it -- a wholesale rewrite of the page
        # holding the lists reworded one anchor and would have gone
        # unchecked here. Patterns rather than the list of files the
        # suite happens to read today, so the two cannot drift apart;
        # the suite is stdlib only and takes under a second.
        files: ^(scripts/.*\.py|.*\.md|\.github/workflows/.*\.ya?ml)$

      - id: audit-update-docs-tests
        name: audit doc rendering tests
        entry: python3 scripts/test_audit_update_docs.py
        language: system
        pass_filenames: false
        # Markdown as well as scripts/, because this suite also checks
        # that prose naming a test names one that exists, in the file
        # it says. The change that breaks that check is a doc edit, so
        # a scripts-only filter would never run it on the commit that
        # needs it. Any .md rather than a list of the files the test
        # reads, so the two cannot drift apart; the suite is stdlib
        # only and takes milliseconds.
        #
        # templates/ too, since AuditMetadataPathsTest resolves every
        # spec and template path in AUDIT_METADATA against the tree. A
        # renamed template directory happens to drag a README.md along
        # today, but that is a coincidence to depend on rather than a
        # rule.
        files: ^(scripts/.*\.py|.*\.md|templates/.*)$

      - id: review-tracking-tests
        name: review tracking tests
        entry: python3 scripts/test_review_tracking.py
        language: system
        pass_filenames: false
        # No file filter, because this suite now asserts two
        # properties of the whole tree rather than of scripts/: that
        # REVIEWS.md is exactly what the review marks and their sidecar
        # render to, and that every pattern in review-scope.toml still
        # matches a tracked path. Both can be broken by a commit that
        # touches neither -- adding any in-scope file moves the header
        # count, and a scope pattern left behind by a directory move
        # put 36 machine-regenerated files into the review queue with
        # all four suites passing. A filter listing the extensions that
        # can be in scope would be the include list copied by hand,
        # which is the drift this is meant to catch.
        #
        # Running it unconditionally also matters for review-only
        # commits: ci.yml's paths-ignore deliberately skips CI for
        # those, so this hook is the only thing that ever looks at one.
        # The suite is stdlib only and takes about a second and a half,
        # most of it building fixture git repositories.

      - id: check-audit-smoke-tests
        name: audit smoke checker tests
        entry: python3 scripts/test_check_audit_smoke.py
        language: system
        pass_filenames: false
        files: ^scripts/.*\.py$
