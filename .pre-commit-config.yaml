# Lint this repository's own workflows, shell scripts, and Python.
# The consistency audits require every audited project to run
# actionlint, shellcheck, and flake8 via a pre-commit, and this repo is
# one of the audited projects: running them here is what catches a
# breach at commit time instead of in the next morning's audit.
#
# The renovate audit also requires audited projects to enable
# renovate's opt-in pre-commit manager so these revisions stop
# drifting. This repo now runs renovate, and renovate.json enables that
# manager, so the revisions below are watched: expect them to arrive as
# pull requests rather than bumping them by hand, which would only
# conflict with what renovate is already proposing.
repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

      # The workflow templates too. The stock hook only looks at
      # .github/workflows/, so until now nothing checked the files this
      # repository ships to the rest of the fleet -- a broken template
      # would have been found by whoever copied it into their project.
      # They are ordinary workflow files, so actionlint reads them
      # happily when given the paths.
      #
      # The workflow-call resolution check is ignored, and only for
      # these files. A template's `uses: ./.github/workflows/x.yml` is
      # relative to the repository it gets copied *into*, so it cannot
      # resolve here, where the file sits under templates/. That is the
      # one thing about a template actionlint cannot judge from where it
      # is stored; everything else it checks is checked.
      #
      # Five templates carry {{PLACEHOLDER}} substitutions that are not
      # valid YAML until an adopting project fills them in -- a bare
      # {{PROJECT_NAME}} parses as a mapping, not a string -- so they
      # cannot be linted where they are stored. They are excluded by
      # name rather than by a pattern, so adding a sixth is a decision
      # somebody makes rather than one that happens quietly. The seven
      # copy-directly templates, which are the ones the fleet actually
      # runs unmodified, are all checked.
      - id: actionlint
        alias: actionlint-templates
        name: Lint the workflow templates
        files: ^templates/.*\.ya?ml$
        exclude: |
          (?x)^templates/(
            issue-fix/issue-fix\.yml|
            pin-indirect-dependencies/pin-indirect-dependencies\.yml|
            release-automation/release\.yml|
            renovate/renovate\.yml|
            test-drift-fix/test-drift-fix\.yml
          )$
        args:
          - '-config-file'
          - '.github/actionlint.yaml'
          - '-ignore'
          - 'could not read reusable workflow file'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      # scripts/ and tools/ both hold code this repository runs.
      # templates/ is excluded by the pattern on purpose: those files
      # are shipped to other repositories, and several reference
      # variables defined by the workflow that calls them.
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^(scripts|tools)/.*\.py$

  # The llm-context-lint-ci audit requires every audited project with
  # agent context to run skillsaw here and in CI. This repo is audited
  # by its own checks and carries .claude/skills/ and AGENTS.md, so the
  # rule it writes applies to it directly.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.20.0
    hooks:
      - id: skillsaw

  # The automation's own unit tests. They used to run only here,
  # because there was nowhere else for them to run: the only workflow in
  # this repository was the consistency audit, so until this hook
  # existed a broken audit script was first noticed by the audit failing
  # at 06:00 UTC. That is how review-marks-pre-commit reached production
  # without a COLUMN_NAMES heading and cost the fleet a day of
  # compliance tables.
  #
  # ci.yml now runs `pre-commit run --all-files` on every pull request,
  # so these are enforced rather than merely available. Keep them here
  # too: the local run is what makes the CI run boring.
  #
  # language: system rather than a managed environment because every
  # suite is stdlib-only, which is also why the audit scripts can run
  # on a bare runner. pass_filenames is off: they take no arguments
  # and always test the whole surface.
  - repo: local
    hooks:
      - id: audit-package-tests
        name: audit package and script tests
        entry: python3 -m unittest discover -s scripts/tests -t scripts
        language: system
        pass_filenames: false
        # This one hook runs every suite in the repository. There used
        # to be six more beside it, one per suite that lived in
        # scripts/ rather than scripts/tests/, each with a pattern of
        # its own. Once the suites moved, discovery ran them anyway, so
        # each extra hook was a second run of tests this one had
        # already run, under a narrower pattern -- and a narrower
        # pattern is the defect test_hooks.py exists to catch. The
        # exception is review-tracking-tests below, which is kept for
        # the one thing discovery under a pattern cannot do.
        #
        # Markdown and templates as well as scripts/, because these
        # tests read specification pages and canonical shared blocks,
        # so the commit that breaks one of those parses is a
        # documentation commit. AuditMetadataPathsTest also resolves
        # every spec and template path in AUDIT_METADATA against the
        # tree, and DocumentedTestReferencesTest reads every page in
        # docs/ to check that prose naming a test names one that
        # exists.
        #
        # Workflows as well, because two of these tests read this
        # repository's own: AuditScopeIsStatedOnceTest compares the
        # matrix in consistency-audit.yml against the in-scope list in
        # docs/audits/README.md, and GitHooksDisabledTest reads
        # pr-re-review.yml. Bringing a repository into scope is a
        # commit that touches the workflow and nothing else, and that
        # is precisely the commit that must not leave the two lists
        # disagreeing.
        #
        # All of scripts/ rather than just the package, because the
        # suite reaches outside it in several directions: test_metadata
        # and test_registry import the derived tables from
        # audit_common.py, test_review shells out to review-tracking.py
        # the way the check does, and the suites that moved here drive
        # audit-update-docs.py, audit_snapshot.py, check-audit-smoke.py
        # and review-tracking.py directly. A pattern listing only the
        # package would be narrower than the imports, which is the
        # drift this hook exists to catch.
        #
        # And this file, because test_hooks.py reads it to check that
        # every suite hook fires on what its suite reads -- including
        # its own. A pattern that did not watch the config would be
        # the exact defect that test exists to catch.
        #
        # And tools/, because the mermaid-lint tests read
        # tools/mermaid-lint.sh: one pins it byte-identical to the
        # template copy that goes to the fleet, and another runs it to
        # check it selects the same files the audit does. Editing only
        # the script is exactly the commit that breaks either. The
        # directory rather than the one file, deliberately and in the
        # shape of every other clause here: the suite reaches into
        # tools/ and the next thing it reaches for should not need a
        # pattern edit nobody remembers to make.
        files: ^(scripts/.*\.py|tools/.*|.*\.md|templates/.*|\.github/workflows/.*\.ya?ml|\.pre-commit-config\.yaml)$

      - id: review-tracking-tests
        name: review tracking tests
        entry: python3 scripts/tests/test_review_tracking.py
        language: system
        pass_filenames: false
        # Discovery above runs this suite too, so this hook exists for
        # one reason: to run it on the commits the pattern above does
        # not match. It asserts properties of the whole tree rather
        # than of scripts/ -- that REVIEWS.md is exactly what the
        # review marks and their sidecar render to, and that every
        # pattern in review-scope.toml still matches a tracked path --
        # and both can be broken by a commit that touches nothing the
        # pattern above names. Adding any in-scope file moves the
        # header count, and a scope pattern left behind by a directory
        # move put 36 machine-regenerated files into the review queue
        # with every suite passing. A filter listing the extensions
        # that can be in scope would be the include list copied by
        # hand, which is the drift this is meant to catch.
        #
        # Running it unconditionally also matters for review-only
        # commits: ci.yml's paths-ignore deliberately skips CI for
        # those, so this hook is the only thing that ever looks at one.
        # The suite is stdlib only and takes about three seconds, most
        # of it building fixture git repositories, and the second run
        # on a commit that matches both hooks is that cost again and
        # nothing more.
        #
        # always_run is declared rather than left to pre-commit's
        # empty-pattern default, so that the absence of a `files:` line
        # reads as a decision, and so a top-level `exclude:` added
        # later cannot quietly narrow it.
        always_run: true
