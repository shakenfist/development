# CI for shakenfist/development itself.
#
# This repository holds the consistency audits and the automation that
# enforces them, and until this workflow it had no CI of its own: the
# only workflow here was consistency-audit.yml, which runs on a
# schedule against other people's repositories. So a change to the
# audit machinery was first exercised by the next scheduled run,
# against the whole fleet at once, with issue filing and the compliance
# tables downstream of it.
#
# That is how the audit came to be broken fleet-wide for a day in
# August 2026: a bare `pip install` in consistency-audit.yml met a
# runner enforcing PEP 668, every matrix leg failed at the same step,
# and nothing measured anything until somebody happened to look. The
# .pre-commit-config.yaml header records the same shape of problem
# reaching production once before.
#
# Two gate jobs, because the two failures are different. Lint and tests
# cover the scripts; the audit smoke run covers the workflow's own
# runtime assumptions, which no amount of linting reaches. The
# automated reviewer at the bottom is gated on both. A path filter job
# in front of the two decides whether a pull request needs them at
# all.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whether this pull request needs the two gate jobs below. A review
  # session or a bot prune changes only review state, and no job here
  # reads any of it: the lint and test jobs cover the scripts, and the
  # smoke job exercises the audit workflow's runtime assumptions.
  # Nothing in this workflow scans content, so nothing is lost by
  # skipping. That last point is settled rather than pending: the
  # secret scanner lives in its own secret-scan.yml with no path
  # filter, precisely so it keeps reading review notes and the rest of
  # the prose, so this list can stay as it is.
  #
  # The filter is a job rather than a paths-ignore list on the
  # pull_request trigger because the jobs here back required status
  # checks. A workflow filtered at the trigger never starts, so its
  # required checks never report and the pull request can never
  # merge; a job skipped by its own if: reports skipped, which
  # satisfies a required check. This is the shape the
  # expensive-lane-path-filter audit requires of a workflow that backs
  # one.
  #
  # This job must itself be a required check, and is named "CI paths"
  # rather than "Check paths" because a required check matches by name
  # and codeql-analysis.yml already has a "Check paths" job. Required
  # because a skipped required check passes. The gated jobs below fail
  # open, so today a filter error costs a full run rather than a skip;
  # but were that condition ever lost, a failed filter would skip
  # every gated job and leave the required contexts green. Requiring
  # this job makes a filter that errors block the merge whatever the
  # jobs below do with it.
  #
  # automated_reviewer needs both gate jobs, so it skips when they do,
  # without a condition of its own: a job whose dependency was skipped
  # is skipped.
  ci_paths:
    name: "CI paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    # paths-filter calls pulls.listFiles rather than reading the
    # working tree (see below), and the top-level permissions block
    # sets every scope it does not name to none. This repository is
    # public, so the call would most likely succeed on public-data
    # read alone -- which is exactly why the omission would sit here
    # until it did not.
    permissions:
      pull-requests: read
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # There is deliberately no checkout step. On a pull_request
      # event paths-filter reads the changed-file list from
      # pulls.listFiles, so it never looks at the working tree, and a
      # fork's file content never reaches this long-lived static
      # runner at all.
      #
      # The step is skipped on workflow_dispatch, which has no pull
      # request payload for the action to read; the output above then
      # falls back to 'true', so a dispatched run (which is how
      # pr-retest.yml re-runs this workflow) runs everything.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # By default a file matches if it matches at least one
          # listed pattern, which makes '**' match everything and
          # silently defeats every '!' exclusion below.
          # 'some-with-excludes' means a file is code if it matches
          # any inclusion and no exclusion, which is both what is
          # meant here and what stays correct if a second inclusion is
          # ever added. ('every' also behaves correctly today, but
          # only because there is exactly one positive pattern: it
          # requires a file to match ALL of them, so adding a second
          # inclusion would silently turn this into an intersection
          # matching almost nothing.)
          predicate-quantifier: 'some-with-excludes'
          # The scope config is deliberately not excluded: it decides
          # what is reviewed at all, so a change to it is linted and
          # reviewed like code (review-scope-ci in the audit checks
          # this). docs/ is not excluded either: the test suites read
          # the audit specs and the documents whose prose is parsed.
          filters: |
            code:
              - '**'
              - '!REVIEWS.md'
              - '!.vscode/*.weaudit'
              - '!.vscode/*.weaudit-shas.json'

  lint-and-test:
    name: Lint and test
    # The path filter fails open. By default a job whose dependency did
    # not succeed is skipped, so without !cancelled() any failure of
    # ci_paths would read as "this never ran and the required checks
    # are green". !cancelled() overrides that default; a failed
    # ci_paths yields no output, an empty output is != 'false', and
    # so this job runs. Only a filter that positively said 'false'
    # skips it.
    needs: [ci_paths]
    if: |
      !cancelled()
      && needs.ci_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-and-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A venv for the same reason consistency-audit.yml uses one: the
      # runners enforce PEP 668 and refuse a bare install. Under
      # runner.temp, with --clear, for the reason it gives as well: a
      # fixed /tmp path is shared with every other job on the host.
      - name: Install pre-commit
        run: |
          python3 -m venv --clear "${RUNNER_TEMP}/venv-lint"
          "${RUNNER_TEMP}/venv-lint/bin/pip" install --quiet --disable-pip-version-check \
              pre-commit

      # This is the whole gate, and it was already the whole gate --
      # actionlint, shellcheck, flake8, skillsaw, and the three test
      # suites are all hooks. The difference is that something now runs
      # it other than whoever remembers to.
      - name: Run pre-commit hooks
        run: |
          "${RUNNER_TEMP}/venv-lint/bin/pre-commit" run --all-files \
              --show-diff-on-failure

      - name: Clean up
        if: always()
        run: rm -rf "${RUNNER_TEMP}/venv-lint"

  audit-smoke:
    name: Audit smoke run
    # The path filter fails open, for the reason set out on
    # lint-and-test above.
    needs: [ci_paths]
    if: |
      !cancelled()
      && needs.ci_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-audit-smoke
      cancel-in-progress: true
    steps:
      # As in consistency-audit.yml: nothing here pushes, and skillsaw's
      # unpinned dependencies run below.
      #
      # With history, because this job runs the audit against this
      # checkout and plan-retirement dates a plan from the history of
      # docs/plans/index.md. A shallow checkout makes it refuse to
      # answer rather than report that nothing is eligible, and a
      # criterion that raises is what this job exists to catch. No
      # blob filter, unlike the scheduled workflow's clone: this
      # repository is 5.8 MB, so the whole history is cheap, and it
      # keeps the job hermetic -- a filtered checkout would fetch each
      # historical index revision from github.com while the job
      # deliberately runs without a token. The scheduled workflow
      # keeps its filter, where 24 repositories make clone size matter.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The same floor consistency-audit.yml asserts, for the same
      # reason: the audit runs under the runner's python3, not a venv's.
      - name: Check the Python floor
        run: |
          python3 -c 'import sys; sys.exit(sys.version_info < (3, 11) and f"python3 is {sys.version.split()[0]}; the audit needs 3.11 or later")'

      # Deliberately the same install as consistency-audit.yml, on the
      # same runner class. The point of this job is that the scheduled
      # workflow's environment assumptions are exercised on a pull
      # request rather than on the next scheduled run across the whole
      # audit matrix.
      # No count here on purpose: the matrix grows, and a number in a
      # comment is the thing that goes stale without anything noticing.
      - name: Install skillsaw
        run: |
          python3 -m venv --clear "${RUNNER_TEMP}/skillsaw-venv"
          "${RUNNER_TEMP}/skillsaw-venv/bin/pip" install --disable-pip-version-check \
              skillsaw==0.18.0

      # Audits this repository against itself. The verdicts are not the
      # point and are not asserted here. development is audited for
      # real, but by the scheduled workflow with a token and against the
      # default branch; this job runs without one, on a pull request, so
      # its verdicts are not the ones that count. What is asserted is
      # that the machinery ran: it exits zero, it emits parseable JSON,
      # and every check returned a status.
      #
      # No GH_TOKEN, which keeps this job off the audit credentials.
      # The checks that would use one cannot ask GitHub, and report a
      # tool failure that check-audit-smoke.py expects and lists.
      - name: Run the audit against this repository
        run: |
          python3 scripts/audit-check.py \
            --repo-path . \
            --repo-name development \
            --github-org shakenfist \
            > "${RUNNER_TEMP}/audit-smoke.json"
        env:
          AUDIT_SKILLSAW: ${{ runner.temp }}/skillsaw-venv/bin/skillsaw

      # The load-bearing assertion. A skillsaw that cannot run makes
      # llm-context-lint report error, and the audit step above still
      # exits zero, so a skillsaw that silently went missing would
      # leave every other step here green. Asserting the check reached
      # a verdict is what makes this job a detector rather than a smoke
      # test that happens to pass.
      - name: Check the audit actually measured
        run: python3 scripts/check-audit-smoke.py "${RUNNER_TEMP}/audit-smoke.json"

      - name: Clean up
        if: always()
        run: rm -rf "${RUNNER_TEMP}/skillsaw-venv" "${RUNNER_TEMP}/audit-smoke.json"

  # The automatic review, gated on both jobs above passing: a job that
  # is skipped because a dependency failed never starts the reusable
  # workflow, so the needs list *is* the CI-passed gate.
  #
  # No event guard is needed even though this workflow also triggers on
  # workflow_dispatch (which is how pr-retest.yml re-runs it). The
  # reusable workflow's own job carries
  # `if: github.event_name == 'pull_request' && ...`, so a dispatch run
  # skips it cleanly rather than failing on a null pull request.
  #
  # The body lives once, in shakenfist/actions. The permissions block
  # has to be here rather than there -- a cross-repository reusable
  # workflow cannot grant itself more token scope than its caller has --
  # and for the same reason this job cannot set runs-on or
  # timeout-minutes, which the reusable workflow defines. And
  # deliberately no secrets: inherit -- nothing in the reviewer chain
  # reads a secret, so inheriting would hand every secret this
  # repository holds to a workflow in another one for no benefit.
  automated_reviewer:
    name: "Automated reviewer"
    needs: [lint-and-test, audit-smoke]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
