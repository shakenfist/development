# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators. An empty include list would mean all tracked
# files.
#
# There is no application code here, so the reviewable artifacts are
# the audit tooling (scripts/), the workflows that run it, the
# templates the fleet copies from, and the prose that defines what the
# standards are. The templates matter most of anything here: a
# template is copied into ten repositories, so a mistake in one is a
# mistake ten times over, and nothing in CI reads them as the files
# they will become.
#
# The extension list is enumerated rather than left empty, so that a
# file type arriving here fails the review-scope-completeness audit
# and gets a decision, instead of quietly joining the queue. That
# audit is also what makes the list safe to enumerate: before it
# existed, templates/renovate/renovate.json was outside review purely
# because nobody had thought about JSON, and nothing said so.
#
# .flake8 and .gitignore are named individually because they have no
# extension to match on, and both are hand-written configuration that
# shapes every other file here.
include = [
    '*.py', '*.sh', '*.md', '*.yml', '*.yaml', '*.toml', '*.json',
    '.flake8', '.gitignore',
]

# docs/plans/ holds point-in-time records of intended work, not living
# artifacts, and would swamp the queue. Every plan lives there now --
# the five that used to sit at the repository root were moved in
# 2026-08. The PLAN-*.md pattern is kept as a guard against them
# reappearing at the root rather than because it currently matches
# anything.
#
# docs/audits/compliance.md is the one generated file in this
# repository, and the only reason it is excluded is its first line:
# `*Generated <timestamp> from scripts/audit-check.py; do not edit.*`,
# rewritten on every daily run. That timestamp is deliberate -- it is
# how a reader tells a current verdict from a stale one when the audit
# has silently stopped running, which the workflow's own failure issue
# says in as many words. But a review mark attests to whole-file
# content, so a file carrying a line that moves daily can never hold
# one, and including it would keep a permanently-stale entry in the
# queue and a review-coverage issue open that no amount of reviewing
# could close.
#
# All 35 criterion specifications beside it are in scope. Until
# 2026-08-27 they were not: each carried its own copy of the generated
# table, so all of docs/audits/ was excluded and the 2,519 lines of
# hand-written prose defining what the fleet is held to -- the most
# consequential writing here after this repository's own
# documentation -- could not be reviewed at all. The tables moved to
# one page precisely so that they can be. A specification that regrows
# a generated block becomes unreviewable again;
# test_audit_update_docs.py fails on one, which is the guard that
# keeps this exclusion a single file.
#
# A pattern that is meant to match nothing today carries an
# `unmatched-by-design` trailing comment on its own entry below --
# not on a line of its own, and not up here in the prose, both of
# which the test suite rejects. That marker is what tells it the
# difference between a deliberate guard and a stale pattern.
#
# LICENSE is verbatim upstream text; reviewing it would attest to the
# Apache Software Foundation.
#
# .github/exported-config/ was excluded until 2026-09-01, on the
# grounds that the export-repo-config workflow writes it from the
# GitHub API, so a mark there attests to GitHub's state rather than to
# anything a person wrote here. It is in scope now because that state
# is still chosen by a person -- one setting at a time, in a web UI
# that records nothing about why -- and the criteria that read these
# files (github-security, merge-queue-config, delete-branch-on-merge,
# default-branch-naming) each look at a handful of named fields, so a
# setting no criterion was written for is checked by nothing at all.
# Three short files is a cheap place for a human to notice one. The
# objection that keeps compliance.md out does not apply here: these
# carry no timestamp and change only when the configuration does, so
# a mark survives until someone changes a setting -- and being asked
# to read them again when that happens is the point.
exclude = [
    'docs/plans/*',
    'PLAN-*.md',  # unmatched-by-design: a guard against plans returning to the root
    'docs/audits/compliance.md',
    'LICENSE',
]
